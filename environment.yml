---
name: xconv2
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.12
  - pip !=21.3
  - cartopy  # no pip wheel
  - cf-plot >=3.5.0
  - cf-python >=3.21.0
  - cryptography
  - esmpy
  - fsspec
  - jsonschema  # missing in pystac-client github.com/conda-forge/pystac-client-feedstock/issues/34
  - numpy
  - pandas
  - paramiko
  - pillow
  - prov
  - pyfive >=1.2.0
  - pyside6
  - pystac-client
  - rdflib
  - s3fs
  - setuptools >80  # cf-plot imports distutils
  - superqt
  - udunits2  # no pip wheel; required by cf-python/cf-units
  - umfive >=0.4.0
  - zarr 
  - pytest
