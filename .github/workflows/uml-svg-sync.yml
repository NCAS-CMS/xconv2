name: UML SVG Sync Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-uml-svgs:
    name: Verify UML SVGs are up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install Graphviz and Java
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz default-jre-headless curl

      - name: Install latest PlantUML
        run: |
          curl -fsSL -o "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar"
          cat > "$RUNNER_TEMP/plantuml" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -Djava.awt.headless=true -jar "$RUNNER_TEMP/plantuml.jar" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/plantuml"

      - name: Regenerate UML SVG diagrams
        env:
          PLANTUML_BIN: ${{ runner.temp }}/plantuml
        run: ./tools/generate_uml_svgs.sh

      - name: Fail on out-of-sync UML SVGs
        run: |
          if [[ -n "$(git status --porcelain -- docs/uml/svg)" ]]; then
            echo "UML SVG diagrams are out of sync with their PlantUML sources."
            echo "Run ./tools/generate_uml_svgs.sh and commit the updated docs/uml/svg files."
            git status --short -- docs/uml/svg
            git diff -- docs/uml/svg || true
            exit 1
          fi
